<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>КТО Я? · Phone — Оспаривание</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="whoami/whoami.css"/>
<style>
  .warn { margin-top: 22px; padding: 30px 22px 26px; border-radius: var(--r-2xl); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
    background: linear-gradient(165deg, rgba(255,159,10,.16), rgba(255,159,10,.05));
    border: 1px solid rgba(255,159,10,.4);
    box-shadow: 0 24px 60px -22px rgba(255,159,10,.45), inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); }
  .warn .ic { width: 74px; height: 74px; border-radius: 50%; background: rgba(255,159,10,.16); border: 1px solid rgba(255,159,10,.45);
    display: flex; align-items: center; justify-content: center; color: #ffc466; }
  .warn .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: #ffc466; }
  .warn h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: -.6px; line-height: 1.1; }
  .warn .sub { font-size: 15px; color: var(--text-secondary); line-height: 1.45; max-width: 300px; }

  .yours { width: 100%; padding: 15px 18px; border-radius: var(--r-xl); background: rgba(4,20,32,.45); border: .5px solid rgba(255,255,255,.14); text-align: left; }
  .yours .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 6px; }
  .yours .val { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.3px; }

  .how { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--text-tertiary); line-height: 1.45; text-align: left; padding: 0 2px; }
  .how .li { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; color: #ffc466; }
  .how b { color: var(--text-secondary); font-weight: 600; }

  .actions { display: flex; flex-direction: column; gap: 11px; }
</style>
</head>
<body>
<div class="phone-stage wai-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen wai" data-screen-label="Phone · Оспаривание">
      <div class="wai-bg"><div class="blob b1"></div><div class="blob b2"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>

      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#052e46;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span></div><div class="nm">Кто я?<small>Party Hub</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="warn" data-comment-anchor="wai-dispute-card">
          <div class="ic"><span class="li" style="width:40px;height:40px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15"></path><path d="M6 6.5h12"></path><path d="M6 6.5L3.5 12.5a2.9 2.9 0 005 0z"></path><path d="M18 6.5l-2.5 6a2.9 2.9 0 005 0z"></path><path d="M9 19h6"></path></svg></span></div>
          <span class="k">не совпало автоматически</span>
          <h1>Настаиваешь,<br/>что это верно?</h1>
          <div class="sub">Написание не совпало с загаданным точь-в-точь. Опечатка — не приговор.</div>
          <div class="yours">
            <div class="lbl">твой ответ</div>
            <div class="val">«Чебурашк»</div>
          </div>
          <div class="how">
            <span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5"></path><path d="M12 7.5v.01"></path></svg></span>
            <span>После подтверждения <b>случайный игрок</b> сравнит твой ответ с персонажем и вынесет вердикт. Он окончательный.</span>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="actions">
          <button class="btn amber">Подтвердить</button>
        </div>
      </div>

      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
