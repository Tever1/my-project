<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · Phone — Буззер · Капитан</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .round-hd { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 18px; text-align: center; }
  .round-hd .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--h2o-1); }
  .round-hd h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.6px; }
  .cnt-chip { display: inline-flex; align-items: center; gap: 9px; padding: 9px 18px; border-radius: var(--r-full); margin-top: 8px;
    font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--h2o-soft); }
  .cnt-chip .li { width: 20px; height: 20px; }
  .arena { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  .you { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); }
  .foot-hint { text-align: center; font-size: 14px; color: var(--text-tertiary); line-height: 1.45; padding: 0 24px; }
  .foot-hint b { color: var(--h2o-soft); }
</style>
</head>
<body>
<div class="phone-stage h2o-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen h2o" data-screen-label="Phone · Буззер (капитан)">
      <div class="h2o-bg"><div class="beam l"></div><div class="beam r"></div><div class="glow"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>
      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#341f02;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div><div class="nm">100 к 1<small>Party Hub</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="round-hd">
          <span class="k">Раунд 2 · Двойная игра</span>
          <h1>Кто начинает?</h1>
          <span class="cnt-chip glass h2o-pulse"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.6V13l2.4 1.9"></path><path d="M9.5 3.5h5"></path></svg></span>2</span>
        </div>

        <div class="arena">
          <div class="you"><span class="tm-dot t1"></span>Катя · капитан «Акулы»</div>
          <button class="buzzer-btn armed">ЖМИ!<small style="font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:2px;opacity:.8;">ПО НУЛЮ</small></button>
        </div>

        <div class="foot-hint">Кто первым нажмёт после отсчёта — <b>та команда атакует раунд</b>. Фальстарт не считается.</div>
      </div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
