<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · Phone — Большая игра · Проверка</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .top .k { font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--h2o-soft); }
  .top .sub { font-size: 12.5px; color: var(--text-tertiary); margin-top: 2px; }
  .fchip { display: flex; flex-direction: column; align-items: center; padding: 8px 18px; border-radius: var(--r-lg); }
  .fchip .kk { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,251,235,.8); }
  .fchip .vv { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -.5px; }
  .vq { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--r-xl); margin-top: 14px; }
  .vq .qn { font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--h2o-1); }
  .vq .qt { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.3px; line-height: 1.2; }
  .vq .pa { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-md);
    background: rgba(0,0,0,.22); border: .5px solid var(--glass-border); }
  .vq .pa .who { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-quaternary); }
  .vq .pa b { font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--text-primary); }
  .opts { display: flex; flex-direction: column; gap: 7px; }
  .opt { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: var(--r-md); cursor: pointer;
    background: var(--glass-bg); border: .5px solid var(--glass-border);
    font-family: var(--font-display); font-weight: 700; font-size: 15.5px; color: var(--text-secondary); }
  .opt .pts { margin-left: auto; font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--text-tertiary); }
  .opt.match { border-color: rgba(48,209,88,.6); background: rgba(48,209,88,.1); color: #86efac; }
  .opt.match .pts { color: #54e57e; }
  .opt.match .li { width: 18px; height: 18px; color: #54e57e; }
  .opt.miss { border-style: dashed; color: var(--text-secondary); }
  .opt.miss .li { width: 18px; height: 18px; color: #ff8d84; }
  .opts-hint { font-size: 11.5px; color: var(--text-quaternary); text-align: center; margin-top: 4px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
  .controls .btn { height: 52px; font-size: 15.5px; border-radius: var(--r-md); }
</style>
</head>
<body>
<div class="phone-stage h2o-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen h2o" data-screen-label="Phone · Большая игра · Проверка (ведущий)">
      <div class="h2o-bg"><div class="beam l"></div><div class="beam r"></div><div class="glow"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>
      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#341f02;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div><div class="nm">100 к 1<small>Ведущий</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="top">
          <div><div class="k">Большая игра · Проверка</div><div class="sub">Сопоставь ответ Ани с таблицей — тапни совпадение</div></div>
          <div class="fchip h2o-accent-card"><span class="kk">Фонд</span><span class="vv">154</span></div>
        </div>

        <div class="vq glass-strong">
          <span class="qn">Вопрос 3 из 5</span>
          <span class="qt">Профессия, о которой мечтают дети?</span>
          <div class="pa"><span class="who">Ответ Ани</span><b>«Космонавт»</b></div>
          <div class="opts">
            <div class="opt match"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 6.5"></path></svg></span>Космонавт<span class="pts">+30</span></div>
            <div class="opt">Врач<span class="pts">24</span></div>
            <div class="opt">Пожарный<span class="pts">18</span></div>
            <div class="opt">Артист<span class="pts">14</span></div>
            <div class="opt">Полицейский<span class="pts">9</span></div>
            <div class="opt miss"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></span>Нет в таблице<span class="pts">0</span></div>
          </div>
          <div class="opts-hint">Совпадение с ответом игрока 1 — попроси другой ответ</div>
        </div>

        <div class="spacer"></div>
        <div class="controls">
          <button class="btn glass"><span class="li" style="width:17px;height:17px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 111.9 5"></path><path d="M4.5 20v-5h5"></path></svg></span>Другой ответ</button>
          <button class="btn h2o">Засчитать +30</button>
        </div>
      </div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
