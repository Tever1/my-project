<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · TV — Заставка</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="tv/tv.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .screen { display: flex; flex-direction: column; height: 100%; padding: 48px 64px 44px; position: relative; z-index: 1; }
  .hd { display: flex; justify-content: space-between; align-items: center; }
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .logo .m { width: 148px; height: 148px; border-radius: 40px; display: flex; align-items: center; justify-content: center;
    color: #341f02; animation: logoIn .7s cubic-bezier(.2,.9,.3,1.25) both; }
  @keyframes logoIn { from { transform: scale(.7) translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .logo .m { animation: none; } }
  .logo h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 148px; line-height: .9; letter-spacing: -5px;
    background: linear-gradient(180deg, #fde68a 10%, #f59e0b 60%, #d97706 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 14px 44px rgba(245,158,11,.35)); }
  .logo .sub { font-family: var(--font-mono); font-weight: 600; font-size: 20px; letter-spacing: 9px; text-transform: uppercase; color: var(--text-tertiary); }
  .vs { display: flex; align-items: center; gap: 40px; }
  .vs .tcard { display: flex; align-items: center; gap: 18px; padding: 24px 40px; border-radius: var(--r-xl); }
  .vs .tcard .nm { font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: -.6px; }
  .vs .tcard .tm-dot { width: 16px; height: 16px; }
  .vs .x { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: 2px; color: var(--h2o-1); }
  .wait { display: inline-flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: var(--r-full);
    font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--text-secondary); }
  .wait .li { width: 26px; height: 26px; color: var(--h2o-soft); }
  .wait b { color: var(--h2o-soft); }
  .footer { display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="tv-stage">
  <div class="tv-screen h2o" data-screen-label="TV · Заставка">
    <div class="h2o-bg"><div class="beam l"></div><div class="beam r"></div><div class="glow"></div></div>
    <div class="screen">
      <div class="hd">
        <div class="tv-brand">
          <div class="mark"><span class="li" style="width:36px;height:36px;color:#341f02;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div>
          <div class="name">100 к 1<small>Party Hub</small></div>
        </div>
        <div class="pill live"><span class="dot"></span> 9 в игре</div>
      </div>

      <div class="main">
        <div class="logo">
          <div class="m h2o-accent-card"><span class="li" style="width:78px;height:78px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div>
          <h1>100 к 1</h1>
          <div class="sub">Телеигра · Тема: Общие вопросы</div>
        </div>
        <div class="vs">
          <div class="tcard tm1-card glass-strong"><span class="tm-dot t1"></span><span class="nm">АКУЛЫ</span></div>
          <span class="x">VS</span>
          <div class="tcard tm2-card glass-strong"><span class="tm-dot t2"></span><span class="nm">ЗУБРЫ</span></div>
        </div>
        <div class="wait glass"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9.2" y="3" width="5.6" height="10.4" rx="2.8"></rect><path d="M6.5 11.8a5.5 5.5 0 0011 0"></path><path d="M12 17.3v3.2"></path><path d="M9.5 20.5h5"></path></svg></span>Ведущий <b>Оля</b> начнёт игру со своего телефона</div>
      </div>

      <div class="footer">
        <div class="remote-hint glass"><span class="li" style="width:24px;height:24px;color:var(--h2o-soft);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"></rect><path d="M10.5 18.6h3"></path></svg></span> <span>4 раунда + Большая игра ·</span> <b>фонд 200 — победа</b></div>
      </div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); document.querySelector('.tv-screen').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
