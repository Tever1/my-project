<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>КТО Я? · TV — Оспаривание</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="tv/tv.css"/>
<link rel="stylesheet" href="whoami/whoami.css"/>
<style>
  .screen { display: flex; flex-direction: column; height: 100%; padding: 48px 64px 44px; position: relative; z-index: 1; }
  .hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .hd .right { display: flex; justify-content: flex-end; }
  .now-pill { display: inline-flex; align-items: center; gap: 16px; padding: 14px 30px 14px 16px; border-radius: var(--r-full); }
  .now-pill .av { width: 46px; height: 46px; font-size: 20px; }
  .now-pill .k { font-family: var(--font-mono); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-tertiary); }
  .now-pill .n { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.4px; color: var(--wai-soft); }
  .prog { display: inline-flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: var(--r-full);
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.2px; }
  .prog .li { width: 24px; height: 24px; color: #54e57e; }
  .prog b { font-family: var(--font-mono); color: var(--wai-soft); }

  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }

  /* dimmed hero behind the banner */
  .hero { width: 980px; border-radius: var(--r-2xl); padding: 48px 56px; display: flex; flex-direction: column; gap: 36px;
    opacity: .38; filter: saturate(.7); transition: opacity var(--t-slow) var(--ease-out); }
  .hero .top { display: flex; align-items: center; gap: 36px; }
  .hero .av { width: 168px; height: 168px; font-size: 72px; box-shadow: 0 0 0 5px rgba(56,189,248,.4), 0 24px 60px -12px rgba(2,132,199,.5); }
  .hero .kicker { color: var(--wai-1); }
  .hero .nm { font-family: var(--font-display); font-weight: 800; font-size: 108px; line-height: .92; letter-spacing: -3.5px; margin-top: 8px; }
  .others { display: flex; justify-content: center; gap: 14px; opacity: .38; }
  .op { display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px 10px 10px; border-radius: var(--r-full); }
  .op .av { width: 48px; height: 48px; font-size: 20px; }
  .op .nm { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -.3px; color: var(--text-secondary); }
  .op .li { width: 22px; height: 22px; color: rgba(48,209,88,.85); }

  /* ── neutral dispute banner (no verdict details on TV) ── */
  .dispute {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 20;
    display: flex; align-items: center; gap: 26px;
    padding: 34px 52px; border-radius: var(--r-full);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 36px 100px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.14);
    animation: springIn .55s cubic-bezier(.2,.9,.3,1.3) both;
  }
  @keyframes springIn { from { transform: translate(-50%,-50%) scale(.78); opacity: 0; } to { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dispute { animation: none; } }
  .dispute .ic { width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.08); border: .5px solid rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center; color: var(--text-secondary); flex-shrink: 0; }
  .dispute .tx b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: -.8px; }
  .dispute .tx span { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 23px; color: var(--text-tertiary); }
  .dispute .d { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); display: inline-block; margin-left: 3px;
    animation: dotPulse 1.4s ease-in-out infinite; }
  .dispute .d:nth-child(2) { animation-delay: .2s; }
  .dispute .d:nth-child(3) { animation-delay: .4s; }
  @keyframes dotPulse { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="tv-stage">
  <div class="tv-screen wai" data-screen-label="TV · Оспаривание">
    <div class="wai-bg"><div class="blob b1"></div><div class="blob b2"></div></div>
    <div class="screen">

      <div class="hd">
        <div class="tv-brand">
          <div class="mark"><span class="li" style="width:36px;height:36px;color:#052e46;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span></div>
          <div class="name">Кто я?<small>Party Hub</small></div>
        </div>
        <div class="now-pill glass"><div class="av" data-seed="3">К</div><div class="col"><span class="k">сейчас ходит</span><span class="n">Катя</span></div></div>
        <div class="right">
          <div class="prog glass"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 6.5"></path></svg></span> Угадали <b>2 из 6</b></div>
        </div>
      </div>

      <div class="main">
        <div class="hero glass-strong">
          <div class="top">
            <div class="av" data-seed="3">К</div>
            <div class="col">
              <div class="kicker">Сейчас ходит</div>
              <div class="nm">Катя</div>
            </div>
          </div>
        </div>
        <div class="others">
          <div class="op glass"><div class="av" data-seed="0">А</div><div class="nm">Аня</div><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 6.5"></path></svg></span></div>
          <div class="op glass"><div class="av" data-seed="1">М</div><div class="nm">Макс</div><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 6.5"></path></svg></span></div>
          <div class="op glass"><div class="av" data-seed="2">Л</div><div class="nm">Лёша</div></div>
          <div class="op glass"><div class="av" data-seed="4">Д</div><div class="nm">Дима</div></div>
          <div class="op glass"><div class="av" data-seed="5">С</div><div class="nm">Света</div></div>
        </div>
      </div>

      <!-- neutral banner: no answer text, no judge identity — TV must not hint -->
      <div class="dispute glass-strong">
        <div class="ic"><span class="li" style="width:46px;height:46px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15"></path><path d="M6 6.5h12"></path><path d="M6 6.5L3.5 12.5a2.9 2.9 0 005 0z"></path><path d="M18 6.5l-2.5 6a2.9 2.9 0 005 0z"></path><path d="M9 19h6"></path></svg></span></div>
        <div class="tx">
          <b>Катя оспаривает ответ</b>
          <span>решает другой игрок<i class="d"></i><i class="d"></i><i class="d"></i></span>
        </div>
      </div>

      <div class="footer">
        <div class="remote-hint glass"><span class="li" style="width:24px;height:24px;color:var(--wai-soft);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"></rect><path d="M10.5 18.6h3"></path></svg></span> <span>Вердикт выносится на телефоне судьи</span></div>
        <div class="pill live"><span class="dot"></span> 6 в игре</div>
      </div>

    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); document.querySelector('.tv-screen').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
