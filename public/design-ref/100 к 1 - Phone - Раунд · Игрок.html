<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · Phone — Раунд · Игрок</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .score { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .sc { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border-radius: var(--r-lg); }
  .sc .nm { font-family: var(--font-display); font-weight: 800; font-size: 14.5px; letter-spacing: -.2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc .v { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.5px; }
  .sc.tm1-card .v { color: #ffe155; } .sc.tm2-card .v { color: #ff7a70; }
  .sc.active { position: relative; }
  .sc.active::before { content: ''; position: absolute; inset: -2px; border-radius: inherit; pointer-events: none;
    border: 1.5px solid rgba(255,214,10,.6); box-shadow: 0 0 18px -3px rgba(255,214,10,.4); }
  .rline { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 10px; }
  .rline .rt { font-family: var(--font-mono); font-weight: 700; font-size: 12.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--h2o-soft); }
  .rline .mult { font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: var(--h2o-1);
    padding: 2px 9px; border-radius: var(--r-full); background: rgba(245,158,11,.13); border: .5px solid rgba(245,158,11,.4); }
  .bankrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 10px 16px; border-radius: var(--r-xl); }
  .bankrow .strikes { gap: 6px; }
  .bankrow .strike-x { width: 26px; height: 26px; border-width: 1.2px; }
  .bankrow .strike-x .li { width: 13px; height: 13px; }
  .bankrow .bank { gap: 0; }
  .bankrow .bank .k { font-size: 10px; letter-spacing: 3px; }
  .bankrow .bank .v { font-size: 34px; line-height: 1.05; letter-spacing: -1px; }
  .q { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: var(--r-lg); margin: 10px 0; }
  .q .ic { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(245,158,11,.13); border: .5px solid rgba(245,158,11,.35); color: var(--h2o-soft); }
  .q .ic .li { width: 19px; height: 19px; }
  .q .tx { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.2px; line-height: 1.25; text-wrap: balance; }
  .board { display: flex; flex-direction: column; gap: 7px; }
  .ans { height: 46px; gap: 10px; padding-right: 15px; border-radius: var(--r-md); }
  .ans .idx { width: 38px; font-size: 14px; }
  .ans .tx { font-size: 16.5px; }
  .ans.closed .tx { font-size: 13px; }
  .ans .pts { font-size: 16.5px; }
</style>
</head>
<body>
<div class="phone-stage h2o-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen h2o" data-screen-label="Phone · Раунд (игрок)">
      <div class="h2o-bg"><div class="beam l"></div><div class="beam r"></div><div class="glow"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>
      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#341f02;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div><div class="nm">100 к 1<small>Party Hub</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="score">
          <div class="sc tm1-card active"><span class="tm-dot t1"></span><span class="nm">АКУЛЫ</span><span class="v">240</span></div>
          <div class="sc tm2-card"><span class="tm-dot t2"></span><span class="nm">ЗУБРЫ</span><span class="v">180</span></div>
        </div>

        <div class="rline"><span class="rt">Раунд 2 · Двойная игра</span><span class="mult">×2</span></div>

        <div class="bankrow glass-strong">
          <div class="strikes v" aria-label="Страйки АКУЛЫ">
            <span class="strike-x on"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></span></span>
            <span class="strike-x"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></span></span>
            <span class="strike-x"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></span></span>
          </div>
          <div class="bank"><span class="k">Банк раунда</span><span class="v">120</span></div>
          <div class="strikes v" aria-label="Страйки ЗУБРЫ">
            <span class="strike-x"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></span></span>
            <span class="strike-x"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></span></span>
            <span class="strike-x"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></span></span>
          </div>
        </div>

        <div class="q">
          <div class="ic"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.2V6.9c0-1.3 1-2.4 2.3-2.4h10.4c1.3 0 2.3 1.1 2.3 2.4v6.5c0 1.3-1 2.3-2.3 2.3H9.6L6 18.9v-2.7z"></path><path d="M10.5 8.3c.2-1 1-1.6 2-1.5 1 .1 1.7.9 1.6 1.9-.1 1.2-1.7 1.3-1.8 2.5"></path><path d="M12.3 13.5v.01"></path></svg></span></div>
          <div class="tx">Что люди чаще всего забывают, выходя из дома?</div>
        </div>

        <div class="board">
          <div class="ans open"><span class="idx">1</span><span class="tx">Телефон</span><span class="pts">34</span></div>
          <div class="ans open fresh"><span class="idx">2</span><span class="tx">Ключи</span><span class="pts">26</span></div>
          <div class="ans closed"><span class="idx">3</span><span class="tx">? ? ? ? ?</span><span class="pts">··</span></div>
          <div class="ans closed"><span class="idx">4</span><span class="tx">? ? ? ? ?</span><span class="pts">··</span></div>
          <div class="ans closed"><span class="idx">5</span><span class="tx">? ? ? ? ?</span><span class="pts">··</span></div>
          <div class="ans closed"><span class="idx">6</span><span class="tx">? ? ? ? ?</span><span class="pts">··</span></div>
        </div>

        <div class="spacer"></div>
        <div class="kick" style="text-align:center;">Отвечает ваша команда — говорите вслух, ведущий откроет ответ</div>
      </div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
