<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · TV — Подготовка</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="tv/tv.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .screen { display: flex; flex-direction: column; height: 100%; padding: 48px 64px 44px; position: relative; z-index: 1; }
  .hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .hd .right { display: flex; justify-content: flex-end; }
  .steps { display: inline-flex; align-items: center; gap: 22px; padding: 14px 28px; border-radius: var(--r-full); }
  .steps .s { display: flex; align-items: center; gap: 9px; font-family: var(--font-mono); font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-quaternary); }
  .steps .s .d { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .steps .s.done { color: var(--text-tertiary); } .steps .s.done .d { background: rgba(245,158,11,.55); }
  .steps .s.now { color: var(--h2o-soft); font-weight: 700; } .steps .s.now .d { background: var(--h2o-1); box-shadow: 0 0 12px rgba(245,158,11,.8); animation: pulse 1.6s var(--ease-out) infinite; }
  .main { flex: 1; display: grid; grid-template-columns: 1fr 460px 1fr; gap: 40px; align-items: stretch; margin-top: 34px; min-height: 0; }
  .tcol { display: flex; flex-direction: column; gap: 14px; padding: 30px; border-radius: var(--r-2xl); }
  .tcol .th { display: flex; align-items: center; gap: 14px; }
  .tcol .th .nm { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -.5px; }
  .tcol .th .cnt { margin-left: auto; font-family: var(--font-mono); font-weight: 600; font-size: 15px; color: var(--text-tertiary); }
  .tcol .tname { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 13.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); margin: -4px 0 6px; }
  .tcol .tname b { color: var(--h2o-soft); letter-spacing: 1px; }
  .pl { display: flex; align-items: center; gap: 12px; padding: 9px 16px 9px 9px; border-radius: var(--r-full); background: var(--glass-bg); border: .5px solid var(--glass-border); }
  .pl .av { width: 46px; height: 46px; font-size: 20px; }
  .pl .nm { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.3px; }
  .pl .li.star { margin-left: auto; width: 24px; height: 24px; color: var(--h2o-soft); }
  .pl.captain { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.09); }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 34px 30px; border-radius: var(--r-2xl); }
  .qr { width: 220px; height: 220px; border-radius: var(--r-lg); background: #fffbeb; padding: 14px;
    box-shadow: 0 18px 44px -14px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.2); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .code { font-family: var(--font-mono); font-weight: 700; font-size: 42px; letter-spacing: 12px; color: var(--h2o-soft); }
  .mid .k { font-family: var(--font-mono); font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-tertiary); text-align: center; }
  .hostrow { display: flex; align-items: center; gap: 12px; padding: 10px 22px 10px 10px; border-radius: var(--r-full); margin-top: auto; }
  .hostrow .av { width: 44px; height: 44px; font-size: 19px; }
  .hostrow .li { width: 22px; height: 22px; color: var(--h2o-soft); }
  .hostrow .nm { font-family: var(--font-display); font-weight: 700; font-size: 21px; }
  .hostrow small { font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); }
  .footer { display: flex; justify-content: center; margin-top: 26px; }
</style>
