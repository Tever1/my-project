<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>КТО Я? · Phone — Твой ход</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="whoami/whoami.css"/>
<style>
  /* last-guess toast */
  .toast { display: flex; align-items: center; gap: 12px; padding: 11px 16px 11px 11px; border-radius: var(--r-lg); margin-bottom: 12px;
    animation: toastIn .5s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes toastIn { from { transform: scale(.9) translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  .toast .ic { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(165deg, #38bdf8, #0369a1); color: #f0f9ff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px -6px rgba(2,132,199,.7); }
  .toast .tx { font-size: 14px; color: var(--text-secondary); line-height: 1.35; }
  .toast .tx b { color: var(--text-primary); }
  .toast .tx em { font-style: normal; color: var(--wai-soft); font-weight: 600; }

  /* hint line — no card wrapper (per QA) */
  .hint { display: flex; align-items: center; gap: 9px; margin: 2px 4px 10px; font-size: 14px; color: var(--wai-soft); font-weight: 500; }
  .hint .li { width: 18px; height: 18px; flex-shrink: 0; }

  /* players list */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .pr { display: flex; align-items: center; gap: 12px; padding: 9px 14px 9px 9px; border-radius: var(--r-lg); }
  .pr .av { width: 42px; height: 42px; font-size: 18px; }
  .pr .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .pr .nm { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.2px; }
  .pr .ch { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr .ch b { color: var(--wai-soft); font-weight: 600; }

  /* self row = current turn: accent card + pointer, character masked */
  .pr.me { border-radius: var(--r-xl); padding: 12px 14px 12px 12px; }
  .pr.me .nm { color: #f0f9ff; font-size: 17px; }
  .pr.me .turn { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(240,249,255,.75); }
  .pr.me .ptr { margin-left: auto; width: 24px; height: 24px; color: #f0f9ff; flex-shrink: 0;
    animation: nudge 1.6s var(--ease-out) infinite; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  .pr.me .qq { margin-left: 10px; display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--r-full);
    background: rgba(4,24,37,.35); border: 1px dashed rgba(240,249,255,.4);
    font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: 2px; color: rgba(240,249,255,.9); }
  .pr.me .qq .li { width: 15px; height: 15px; opacity: .8; }

  /* bottom controls */
  .controls { display: flex; flex-direction: column; gap: 11px; }
  .controls .series { display: flex; justify-content: center; }
  .controls .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
</style>
</head>
<body>
<div class="phone-stage wai-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen wai" data-screen-label="Phone · Твой ход">
      <div class="wai-bg"><div class="blob b1"></div><div class="blob b2"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>

      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#052e46;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span></div><div class="nm">Кто я?<small>Party Hub</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="toast glass">
          <div class="ic"><span class="li" style="width:21px;height:21px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 20l3.1-8.9 5.6 5.6L4.2 20z"></path><path d="M9.7 8.7l.8-2.5"></path><path d="M15.3 14.3l2.5-.8"></path><path d="M13 10.9c.6-1.8 1.9-2.3 3.5-2.1 1.6.2 2.8-.4 3.1-1.9"></path></svg></span></div>
          <div class="tx"><b>Аня угадала!</b> Она была — <em>Гарри Поттер</em> · +80 очков</div>
        </div>

        <div class="hint"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 014.4 12.4c-.9.8-1.4 1.5-1.4 2.6h-6c0-1.1-.5-1.8-1.4-2.6A7 7 0 0112 3z"></path><path d="M9.8 21h4.4"></path></svg></span>Задай вопрос вслух с ответом «Да» или «Нет»</div>

        <div class="list">
          <div class="pr me wai-accent-card" data-comment-anchor="wai-self-row">
            <div class="av" data-seed="3">К</div>
            <div class="who"><span class="turn">твой ход</span><span class="nm">Катя</span></div>
            <div class="qq"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span>???</div>
            <span class="li ptr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h15"></path><path d="M14 6.5l5.5 5.5-5.5 5.5"></path></svg></span>
          </div>
          <div class="pr glass"><div class="av" data-seed="0">А</div><div class="who"><span class="nm">Аня</span><span class="ch">была — <b>Гарри Поттер</b></span></div></div>
          <div class="pr glass"><div class="av" data-seed="1">М</div><div class="who"><span class="nm">Макс</span><span class="ch"><b>Билли Айлиш</b></span></div></div>
          <div class="pr glass"><div class="av" data-seed="2">Л</div><div class="who"><span class="nm">Лёша</span><span class="ch"><b>Шерлок Холмс</b></span></div></div>
          <div class="pr glass"><div class="av" data-seed="4">Д</div><div class="who"><span class="nm">Дима</span><span class="ch"><b>Клеопатра</b></span></div></div>
          <div class="pr glass"><div class="av" data-seed="5">С</div><div class="who"><span class="nm">Света</span><span class="ch"><b>Юрий Гагарин</b></span></div></div>
        </div>

        <div class="spacer"></div>

        <div class="controls">
          <div class="series">
            <div class="yes-series">
              <span class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></span>
              <span class="lbl">«Да» подряд · <b>1 из 3</b></span>
            </div>
          </div>
          <div class="pair">
            <button class="btn glass">Нет</button>
            <button class="btn glass">Да</button>
          </div>
          <button class="btn wai">Я знаю!</button>
        </div>
      </div>

      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
