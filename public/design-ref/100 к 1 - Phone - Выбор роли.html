<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · Phone — Выбор роли</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .kicker-line { display: flex; align-items: center; gap: 9px; margin: 4px 4px 14px; font-size: 14px; color: var(--h2o-soft); font-weight: 500; }
  .kicker-line .li { width: 18px; height: 18px; flex-shrink: 0; }
  .roles { display: flex; flex-direction: column; gap: 12px; }
  .role { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-xl); }
  .role .hd { display: flex; align-items: center; gap: 11px; }
  .role .hd .nm { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -.2px; }
  .role .hd .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
  .role .hd .mic { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: rgba(245,158,11,.14); border: .5px solid rgba(245,158,11,.4); color: var(--h2o-soft); }
  .role .hd .mic .li { width: 18px; height: 18px; }
  .members { display: flex; flex-wrap: wrap; gap: 7px; }
  .mb { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 6px; border-radius: var(--r-full);
    background: rgba(0,0,0,.22); border: .5px solid var(--glass-border); font-family: var(--font-display); font-weight: 700; font-size: 13.5px; }
  .mb .av { width: 26px; height: 26px; font-size: 12px; }
  .mb.you { border-color: rgba(245,158,11,.55); background: rgba(245,158,11,.12); color: var(--h2o-soft); }
  .role.mine { position: relative; }
  .role.mine::before { content: ''; position: absolute; inset: -2.5px; border-radius: inherit; pointer-events: none;
    border: 2px solid rgba(245,158,11,.6); box-shadow: 0 0 26px -4px rgba(245,158,11,.45); }
</style>
</head>
<body>
<div class="phone-stage h2o-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen h2o" data-screen-label="Phone · Выбор роли">
      <div class="h2o-bg"><div class="beam l"></div><div class="beam r"></div><div class="glow"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>
      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#341f02;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div><div class="nm">100 к 1<small>Party Hub</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="kicker-line"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19.5c.8-3.1 3-4.9 5.5-4.9s4.7 1.8 5.5 4.9"></path><circle cx="17" cy="9.5" r="2.6"></circle><path d="M16 14.9c2.4-.4 4.4 1.1 5 4.6"></path></svg></span>Выбери свою роль — тапни по карточке</div>

        <div class="roles">
          <div class="role tm1-card mine">
            <div class="hd"><span class="tm-dot t1"></span><span class="nm">Команда 1</span><span class="cnt">4 игрока</span></div>
            <div class="members">
              <span class="mb you"><span class="av" data-seed="3">К</span>Катя · ты</span>
              <span class="mb"><span class="av" data-seed="0">А</span>Аня</span>
              <span class="mb"><span class="av" data-seed="2">Л</span>Лёша</span>
              <span class="mb"><span class="av" data-seed="5">С</span>Света</span>
            </div>
          </div>
          <div class="role tm2-card">
            <div class="hd"><span class="tm-dot t2"></span><span class="nm">Команда 2</span><span class="cnt">4 игрока</span></div>
            <div class="members">
              <span class="mb"><span class="av" data-seed="6">Р</span>Рома</span>
              <span class="mb"><span class="av" data-seed="4">Д</span>Дима</span>
              <span class="mb"><span class="av" data-seed="7">В</span>Вика</span>
              <span class="mb"><span class="av" data-seed="0">М</span>Маша</span>
            </div>
          </div>
          <div class="role glass">
            <div class="hd"><span class="mic"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9.2" y="3" width="5.6" height="10.4" rx="2.8"></rect><path d="M6.5 11.8a5.5 5.5 0 0011 0"></path><path d="M12 17.3v3.2"></path><path d="M9.5 20.5h5"></path></svg></span></span><span class="nm">Ведущий</span><span class="cnt">1 место</span></div>
            <div class="members"><span class="mb"><span class="av" data-seed="1">О</span>Оля</span></div>
          </div>
        </div>

        <div class="spacer"></div>
        <button class="btn h2o">Далее <span style="font-family:inherit;">→</span></button>
      </div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
