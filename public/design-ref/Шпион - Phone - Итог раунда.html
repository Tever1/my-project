<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>ШПИОН · Phone — Итог раунда</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<style>
  .res .banner { padding: 22px 24px; border-radius: var(--r-2xl); display: flex; align-items: center; gap: 16px;
    background: linear-gradient(165deg, rgba(48,209,88,.22), rgba(48,209,88,.08)); border: 1px solid rgba(48,209,88,.45);
    box-shadow: 0 24px 60px -24px rgba(48,209,88,.6); }
  .res .banner .ic { width: 50px; height: 50px; border-radius: 50%; background: #30d158; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px -6px rgba(48,209,88,.7); }
  .res .banner .h { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.5px; line-height: 1.05; }
  .res .banner .s { font-size: 14px; color: #7ee89c; font-family: var(--font-mono); font-weight: 600; margin-top: 4px; }

  .res .reveal { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .res .mini { padding: 20px 18px; border-radius: var(--r-xl); text-align: center; }
  .res .mini .l { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); }
  .res .mini.spy { background: linear-gradient(165deg, rgba(255,59,107,.14), rgba(20,8,18,.4)); border: 1px solid rgba(255,59,107,.4); }
  .res .mini.spy .av { width: 64px; height: 64px; font-size: 28px; margin: 12px auto 10px; position: relative; }
  .res .mini.spy .av .mk { position: absolute; bottom: -4px; right: -4px; font-size: 24px; }
  .res .mini.spy .nm { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
  .res .mini.word { background: linear-gradient(165deg, rgba(100,210,255,.16), rgba(10,132,255,.08)); border: 1px solid rgba(100,210,255,.42);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .res .mini.word .w { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -1px; margin-top: 14px; line-height: 1;
    background: linear-gradient(180deg,#fff,rgba(255,255,255,.6)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .res .mini.word .cat { font-size: 13px; color: var(--text-secondary); margin-top: 8px; }

  .res .standing { margin-top: 16px; padding: 16px 18px; border-radius: var(--r-xl); display: flex; align-items: center; gap: 14px; }
  .res .standing .av { width: 48px; height: 48px; font-size: 20px; }
  .res .standing .pos { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
  .res .standing .meta { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }
  .res .standing .score { margin-left: auto; text-align: right; }
  .res .standing .score .n { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: #ffd60a; line-height: 1; }
  .res .standing .score .u { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); }

  .res .foot-hint { text-align: center; font-size: 13px; color: var(--text-tertiary); margin-top: 12px; }
</style>
</head>
<body>
<div class="phone-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen res" data-screen-label="Phone · Итог раунда">
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"/><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"/><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"/><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"/></svg>
        </span>
      </div>

      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m">🎭</div><div class="nm">Шпион<small>Раунд 3 раскрыт</small></div></div>
          <div class="rcode">GM9K</div>
        </div>

        <div class="banner">
          <div class="ic"><svg width="26" height="26" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="#05210f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="stack"><div class="h">Шпиона раскрыли!</div><div class="s">+1 очко тебе и мирным</div></div>
        </div>

        <div class="reveal">
          <div class="mini spy">
            <div class="l">шпион</div>
            <div class="av" data-seed="3">К<span class="mk">🎭</span></div>
            <div class="nm">Катя</div>
          </div>
          <div class="mini word">
            <div class="l">слово</div>
            <div class="w">Аэропорт</div>
            <div class="cat">📍 Места</div>
          </div>
        </div>

        <div class="standing glass">
          <div class="av" data-seed="4">Д</div>
          <div class="stack"><div class="pos">🥈 Ты на 2-м месте</div><div class="meta">из 6 игроков · +1 за раунд</div></div>
          <div class="score"><div class="n">4</div><div class="u">очка</div></div>
        </div>

        <div class="spacer"></div>

        <button class="btn success"><span class="ic">✓</span> Готов к раунду 4</button>
        <div class="foot-hint">Аня запустит следующий раунд</div>
      </div>

      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
