<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>КТО Я? · TV — Угадала!</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="tv/tv.css"/>
<link rel="stylesheet" href="whoami/whoami.css"/>
<style>
  .screen { display: flex; flex-direction: column; height: 100%; padding: 48px 64px 44px; position: relative; z-index: 1; }
  .hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .hd .right { display: flex; justify-content: flex-end; }
  .now-pill { display: inline-flex; align-items: center; gap: 16px; padding: 14px 30px 14px 16px; border-radius: var(--r-full); }
  .now-pill .av { width: 46px; height: 46px; font-size: 20px; }
  .now-pill .k { font-family: var(--font-mono); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-tertiary); }
  .now-pill .n { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.4px; color: var(--wai-soft); }
  .prog { display: inline-flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: var(--r-full);
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.2px; }
  .prog .li { width: 24px; height: 24px; color: #54e57e; }
  .prog b { font-family: var(--font-mono); color: var(--wai-soft); }

  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
  .hero { width: 980px; border-radius: var(--r-2xl); padding: 48px 56px; display: flex; flex-direction: column; gap: 36px; }
  .hero .top { display: flex; align-items: center; gap: 36px; }
  .hero .av { width: 168px; height: 168px; font-size: 72px;
    box-shadow: 0 0 0 5px rgba(56,189,248,.65), 0 0 0 13px rgba(56,189,248,.12), 0 24px 60px -12px rgba(2,132,199,.7); }
  .hero .kicker { color: var(--wai-1); }
  .hero .nm { font-family: var(--font-display); font-weight: 800; font-size: 108px; line-height: .92; letter-spacing: -3.5px; margin-top: 8px; }

  /* ── overlay: guess result (spring bounce) ── */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(4,14,22,.66);
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    animation: ovIn .4s ease-out both;
  }
  @keyframes ovIn { from { opacity: 0; } to { opacity: 1; } }
  .toast {
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    padding: 64px 96px 56px; border-radius: 56px; text-align: center;
    box-shadow: 0 40px 120px -24px rgba(2,132,199,.75), inset 0 1px 0 rgba(255,255,255,.16);
    border: 1px solid rgba(125,211,252,.35);
    animation: springIn .55s cubic-bezier(.2,.9,.3,1.3) both .1s;
  }
  @keyframes springIn { from { transform: scale(.72) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .overlay, .toast { animation: none; } }
  .toast .ic {
    width: 132px; height: 132px; border-radius: 50%;
    background:
      radial-gradient(110% 70% at 50% -5%, rgba(255,255,255,.3), transparent 55%),
      linear-gradient(165deg, #38bdf8 0%, #0369a1 100%);
    display: flex; align-items: center; justify-content: center; color: #f0f9ff;
    box-shadow: 0 24px 60px -14px rgba(2,132,199,.8), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .toast .h { font-family: var(--font-display); font-weight: 800; font-size: 92px; line-height: .95; letter-spacing: -3px; }
  .toast .h em { font-style: normal; color: var(--wai-1); }
  .toast .chips { display: flex; align-items: center; gap: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 15px 28px; border-radius: var(--r-full);
    font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -.3px; }
  .chip.char { background: rgba(125,211,252,.12); border: 1px solid rgba(125,211,252,.4); color: var(--wai-soft); }
  .chip.pts { background: rgba(48,209,88,.13); border: 1px solid rgba(48,209,88,.4); color: #54e57e; font-family: var(--font-mono); }
  .toast .sub { font-size: 23px; color: var(--text-secondary); }
  .toast .sub b { color: var(--text-primary); }

  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="tv-stage">
  <div class="tv-screen wai" data-screen-label="TV · Угадала!">
    <div class="wai-bg"><div class="blob b1"></div><div class="blob b2"></div></div>
    <div class="screen">

      <div class="hd">
        <div class="tv-brand">
          <div class="mark"><span class="li" style="width:36px;height:36px;color:#052e46;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span></div>
          <div class="name">Кто я?<small>Party Hub</small></div>
        </div>
        <div class="now-pill glass"><div class="av" data-seed="3">К</div><div class="col"><span class="k">сейчас ходит</span><span class="n">Катя</span></div></div>
        <div class="right">
          <div class="prog glass"><span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 6.5"></path></svg></span> Угадали <b>3 из 6</b></div>
        </div>
      </div>

      <div class="main">
        <div class="hero glass-strong">
          <div class="top">
            <div class="av" data-seed="3">К</div>
            <div class="col">
              <div class="kicker">Сейчас ходит</div>
              <div class="nm">Катя</div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="pill live"><span class="dot"></span> 6 в игре</div>
      </div>

      <!-- ── GUESS RESULT OVERLAY ── -->
      <div class="overlay">
        <div class="toast glass-strong">
          <div class="ic"><span class="li" style="width:72px;height:72px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 20l3.1-8.9 5.6 5.6L4.2 20z"></path><path d="M9.7 8.7l.8-2.5"></path><path d="M15.3 14.3l2.5-.8"></path><path d="M13 10.9c.6-1.8 1.9-2.3 3.5-2.1 1.6.2 2.8-.4 3.1-1.9"></path><path d="M13.4 4.4v.01"></path><path d="M19.6 12.9v.01"></path><path d="M17.9 5.3v.01"></path></svg></span></div>
          <div class="h">Аня <em>угадала!</em></div>
          <div class="chips">
            <div class="chip char">Гарри Поттер</div>
            <div class="chip pts">+80 очков</div>
          </div>
          <div class="sub">Понадобилось всего <b>5 вопросов</b></div>
        </div>
      </div>

    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); document.querySelector('.tv-screen').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
