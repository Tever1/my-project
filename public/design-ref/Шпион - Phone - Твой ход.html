<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>ШПИОН · Phone — Твой ход</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<style>
  .turn .banner { padding: 22px 24px; border-radius: var(--r-2xl); display: flex; align-items: center; gap: 18px; position: relative; overflow: hidden;
    background: linear-gradient(165deg, rgba(100,210,255,.2), rgba(10,132,255,.1)); border: 1px solid rgba(100,210,255,.45);
    box-shadow: 0 24px 60px -24px rgba(10,132,255,.6); }
  .turn .banner .ring { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .turn .banner .ring svg { transform: rotate(-90deg); }
  .turn .banner .ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 30px; color: var(--spy-1); }
  .turn .banner .tx .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--spy-1); }
  .turn .banner .tx .h { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -.6px; margin-top: 3px; }
  .turn .banner .tx .s { font-size: 14px; color: var(--text-secondary); margin-top: 3px; }

  .turn .q-card { margin-top: 16px; padding: 24px; border-radius: var(--r-xl); }
  .turn .q-card .from { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .turn .q-card .from .av { width: 38px; height: 38px; font-size: 16px; }
  .turn .q-card .from .l { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); }
  .turn .q-card .from .n { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .turn .q-card .q { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.25; letter-spacing: -.4px; }
  .turn .q-card .q em { color: var(--spy-1); font-style: normal; }

  .turn .peekbar { margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--r-lg);
    background: rgba(100,210,255,.08); border: .5px solid rgba(100,210,255,.28); }
  .turn .peekbar .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); }
  .turn .peekbar .w { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 4px; color: rgba(255,255,255,.18);
    text-shadow: 0 0 14px rgba(255,255,255,.45); user-select: none; }
  .turn .peekbar .hold { margin-left: auto; font-size: 13px; color: var(--spy-1); font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .turn .actions { display: flex; flex-direction: column; gap: 11px; }
  .turn .actions .secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
</style>
</head>
<body>
<div class="phone-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen turn" data-screen-label="Phone · Твой ход">
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"/><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"/><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"/><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"/></svg>
        </span>
      </div>

      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m">🎭</div><div class="nm">Шпион<small>Раунд 3 · Места</small></div></div>
          <div class="rcode">GM9K</div>
        </div>

        <div class="banner">
          <div class="ring">
            <svg width="84" height="84"><circle cx="42" cy="42" r="36" stroke="rgba(255,255,255,.12)" stroke-width="7" fill="none"/><circle cx="42" cy="42" r="36" stroke="#64d2ff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="68" style="filter:drop-shadow(0 0 8px rgba(100,210,255,.7))"/></svg>
            <div class="num">18</div>
          </div>
          <div class="tx">
            <div class="k">сейчас</div>
            <div class="h">Твой ход</div>
            <div class="s">ответь вслух — и передай ход</div>
          </div>
        </div>

        <div class="q-card glass">
          <div class="from"><div class="av" data-seed="1">М</div><div class="stack"><div class="l">вопрос от</div><div class="n">Макса</div></div></div>
          <div class="q">«Ты бы пошёл туда <em>один</em> или с компанией?»</div>
        </div>

        <div class="peekbar">
          <div class="stack"><div class="l">твоё слово</div><div class="w">Аэропорт</div></div>
          <div class="hold">👁 Зажми, чтобы увидеть</div>
        </div>

        <div class="spacer"></div>

        <div class="actions">
          <button class="btn cyan"><span class="ic">→</span> Передать ход</button>
          <div class="secondary">
            <button class="btn glass sm"><span class="ic">🔄</span> Заменить слово</button>
            <button class="btn glass sm"><span class="ic">⏭</span> Пропустить</button>
          </div>
        </div>
      </div>

      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
