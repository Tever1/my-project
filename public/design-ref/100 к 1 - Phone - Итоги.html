<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · Phone — Итоги</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .hero { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px; text-align: center; }
  .hero .cup { width: 88px; height: 88px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: #341f02; }
  .hero h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: -1.5px;
    background: linear-gradient(180deg, #fde68a 10%, #f59e0b 60%, #d97706 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .who { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
  .cards { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .tc { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-xl); }
  .tc .nm { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
  .tc .tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); margin-top: 2px; }
  .tc .v { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 32px; letter-spacing: -1px; }
  .tc.tm1-card .v { color: #ffe155; } .tc.tm2-card .v { color: #ff7a70; }
  .tc.win { position: relative; }
  .tc.win::before { content: ''; position: absolute; inset: -2.5px; border-radius: inherit; pointer-events: none;
    border: 2px solid rgba(245,158,11,.6); box-shadow: 0 0 26px -4px rgba(245,158,11,.45); }
  .fund { display: grid; grid-template-columns: 1fr auto 1fr auto 1.2fr; align-items: center; gap: 8px; margin-top: 14px;
    padding: 14px 16px; border-radius: var(--r-xl); }
  .fund .b { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .fund .b .k { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-quaternary); text-align: center; }
  .fund .b .v { font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--text-primary); }
  .fund .b.t .v { color: #54e57e; text-shadow: 0 0 20px rgba(48,209,88,.5); }
  .fund .b.t .k { color: rgba(84,229,126,.8); }
  .fund .op { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--text-quaternary); text-align: center; }
  .controls { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .controls .row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
</style>
</head>
<body>
<div class="phone-stage h2o-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen h2o" data-screen-label="Phone · Итоги (ведущий)">
      <div class="h2o-bg"><div class="beam l"></div><div class="beam r"></div><div class="glow"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>
      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#341f02;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div><div class="nm">100 к 1<small>Ведущий</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="hero">
          <div class="cup h2o-accent-card h2o-pulse"><span class="li" style="width:48px;height:48px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v4.4a4.5 4.5 0 01-9 0z"></path><path d="M7.5 5.4H4.8a2.9 2.9 0 002.9 3.3"></path><path d="M16.5 5.4h2.7a2.9 2.9 0 01-2.9 3.3"></path><path d="M12 12.9v3"></path><path d="M8.7 20.5h6.6"></path><path d="M12 15.9c-1.7 0-2.5 1.5-2.7 4.6h5.4c-.2-3.1-1-4.6-2.7-4.6z"></path></svg></span></div>
          <h1>ПОБЕДА!</h1>
          <div class="who"><span class="tm-dot t1"></span>АКУЛЫ забирают игру</div>
        </div>

        <div class="cards">
          <div class="tc tm1-card win"><span class="tm-dot t1"></span><div><div class="nm">АКУЛЫ</div><div class="tag">4 раунда + большая игра</div></div><span class="v">240</span></div>
          <div class="tc tm2-card"><span class="tm-dot t2"></span><div><div class="nm">ЗУБРЫ</div><div class="tag">4 раунда</div></div><span class="v">180</span></div>
        </div>

        <div class="fund glass-strong">
          <div class="b"><span class="k">Катя · И1</span><span class="v">118</span></div>
          <span class="op">+</span>
          <div class="b"><span class="k">Аня · И2</span><span class="v">108</span></div>
          <span class="op">=</span>
          <div class="b t"><span class="k">Фонд · цель 200</span><span class="v">226</span></div>
        </div>

        <div class="spacer"></div>
        <div class="controls">
          <button class="btn h2o">Сыграть ещё раз</button>
          <div class="row">
            <button class="btn glass">Поменять команды</button>
            <button class="btn glass">В лобби</button>
          </div>
        </div>
      </div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
