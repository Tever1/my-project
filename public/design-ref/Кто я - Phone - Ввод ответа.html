<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>КТО Я? · Phone — Ввод ответа</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="whoami/whoami.css"/>
<style>
  .ask { margin-top: 22px; padding: 28px 22px 24px; border-radius: var(--r-2xl); display: flex; flex-direction: column; gap: 18px; }
  .ask .top { display: flex; align-items: center; gap: 14px; }
  .ask .gm { width: 56px; height: 56px; border-radius: 17px; flex-shrink: 0;
    background: radial-gradient(110% 70% at 50% -5%, rgba(255,255,255,.28), transparent 55%), linear-gradient(165deg, #38bdf8 0%, #0369a1 100%);
    display: flex; align-items: center; justify-content: center; color: #f0f9ff;
    box-shadow: 0 12px 30px -8px rgba(2,132,199,.7), inset 0 1px 0 rgba(255,255,255,.45); }
  .ask .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--wai-soft); }
  .ask h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.6px; }

  .field { position: relative; padding: 18px 20px; border-radius: var(--r-xl);
    background: rgba(4,20,32,.5); border: 1.5px solid rgba(56,189,248,.65);
    box-shadow: 0 0 0 4px rgba(56,189,248,.14), inset 0 1px 0 rgba(255,255,255,.06); }
  .field .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 7px; }
  .field .val { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -.3px; display: flex; align-items: center; }
  .field .caret { width: 2.5px; height: 30px; border-radius: 2px; background: var(--wai-1); margin-left: 3px;
    animation: blink 1.1s step-end infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

  .note { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--text-tertiary); line-height: 1.45; padding: 0 4px; }
  .note .li { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; color: var(--wai-soft); }
  .note b { color: var(--text-secondary); font-weight: 600; }

  .actions { display: flex; flex-direction: column; gap: 11px; }
</style>
</head>
<body>
<div class="phone-stage wai-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen wai" data-screen-label="Phone · Ввод ответа">
      <div class="wai-bg"><div class="blob b1"></div><div class="blob b2"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>

      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#052e46;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span></div><div class="nm">Кто я?<small>Party Hub</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="ask glass-strong">
          <div class="top">
            <div class="gm"><span class="li" style="width:30px;height:30px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span></div>
            <div class="col">
              <span class="k">попытка угадать</span>
              <h1>Так кто же ты?</h1>
            </div>
          </div>
          <div class="field">
            <div class="lbl">имя персонажа</div>
            <div class="val">Чебурашк<span class="caret"></span></div>
          </div>
          <div class="note">
            <span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5"></path><path d="M12 7.5v.01"></path></svg></span>
            <span>Если написание не совпадёт точь-в-точь — попытка не сгорит: можно <b>оспорить ответ</b>, и решит другой игрок</span>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="actions">
          <button class="btn wai">Угадать!</button>
          <button class="btn glass sm">Отмена</button>
        </div>
      </div>

      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
