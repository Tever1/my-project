<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>100 К 1 · TV — Финал</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="tv/tv.css"/>
<link rel="stylesheet" href="h2o/h2o.css"/>
<style>
  .screen { display: flex; flex-direction: column; height: 100%; padding: 48px 64px 44px; position: relative; z-index: 1; }
  .hd { display: flex; justify-content: space-between; align-items: center; }
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .cup { width: 168px; height: 168px; border-radius: 46px; display: flex; align-items: center; justify-content: center;
    color: #341f02; animation: cupIn .8s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes cupIn { from { transform: scale(.6) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cup { animation: none; } }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 132px; line-height: .92; letter-spacing: -4px;
    background: linear-gradient(180deg, #fde68a 10%, #f59e0b 60%, #d97706 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 14px 44px rgba(245,158,11,.4)); }
  .team { display: flex; align-items: center; gap: 16px; padding: 18px 36px; border-radius: var(--r-full); }
  .team .nm { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: -.5px; }
  .team .tm-dot { width: 15px; height: 15px; }
  .fundline { display: flex; align-items: center; gap: 26px; }
  .fbox { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 40px; border-radius: var(--r-xl); }
  .fbox .k { font-family: var(--font-mono); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-tertiary); }
  .fbox .v { font-family: var(--font-display); font-weight: 800; font-size: 52px; letter-spacing: -1.5px; color: var(--text-primary); }
  .fbox.total .v { color: #54e57e; text-shadow: 0 0 34px rgba(48,209,88,.5); }
  .fbox.total .k { color: rgba(84,229,126,.8); }
  .fbox.total { border: 1px solid rgba(48,209,88,.4); background: rgba(48,209,88,.08); }
  .plus { font-family: var(--font-display); font-weight: 800; font-size: 38px; color: var(--text-quaternary); }
  .footer { display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="tv-stage">
  <div class="tv-screen h2o" data-screen-label="TV · Финал">
    <div class="h2o-bg"><div class="beam l"></div><div class="beam r"></div><div class="glow"></div></div>
    <div class="screen">
      <div class="hd">
        <div class="tv-brand">
          <div class="mark"><span class="li" style="width:36px;height:36px;color:#341f02;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.2a6.5 6.5 0 0113 0"></path><path d="M4 14.2h16v2.4a1.6 1.6 0 01-1.6 1.6H5.6A1.6 1.6 0 014 16.6z"></path><path d="M12 5.2V3.4"></path><path d="M6.9 6.6L5.7 5.2"></path><path d="M17.1 6.6l1.2-1.4"></path></svg></span></div>
          <div class="name">100 к 1<small>Party Hub</small></div>
        </div>
        <div class="pill live"><span class="dot"></span> Большая игра завершена</div>
      </div>

      <div class="main">
        <div class="cup h2o-accent-card h2o-pulse"><span class="li" style="width:92px;height:92px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v4.4a4.5 4.5 0 01-9 0z"></path><path d="M7.5 5.4H4.8a2.9 2.9 0 002.9 3.3"></path><path d="M16.5 5.4h2.7a2.9 2.9 0 01-2.9 3.3"></path><path d="M12 12.9v3"></path><path d="M8.7 20.5h6.6"></path><path d="M12 15.9c-1.7 0-2.5 1.5-2.7 4.6h5.4c-.2-3.1-1-4.6-2.7-4.6z"></path></svg></span></div>
        <h1>ПОБЕДА!</h1>
        <div class="team tm1-card glass-strong"><span class="tm-dot t1"></span><span class="nm">АКУЛЫ</span><span style="font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--text-tertiary);">забирают игру</span></div>
        <div class="fundline">
          <div class="fbox glass"><span class="k">Катя · Игрок 1</span><span class="v">118</span></div>
          <span class="plus">+</span>
          <div class="fbox glass"><span class="k">Аня · Игрок 2</span><span class="v">108</span></div>
          <span class="plus">=</span>
          <div class="fbox total"><span class="k">Фонд · цель 200</span><span class="v">226</span></div>
        </div>
      </div>

      <div class="footer">
        <div class="remote-hint glass"><span class="li" style="width:24px;height:24px;color:var(--h2o-soft);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"></rect><path d="M10.5 18.6h3"></path></svg></span> <span>Ведущий вернёт всех</span> <b>в лобби</b></div>
      </div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); document.querySelector('.tv-screen').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
