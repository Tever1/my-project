<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>КТО Я? · Phone — Судья</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="foundation/tokens.css"/>
<link rel="stylesheet" href="mobile/phone.css"/>
<link rel="stylesheet" href="whoami/whoami.css"/>
<style>
  .judge { margin-top: 22px; padding: 28px 20px 24px; border-radius: var(--r-2xl); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .judge .ic { width: 74px; height: 74px; border-radius: 50%; background: rgba(125,211,252,.1); border: 1px solid rgba(125,211,252,.35);
    display: flex; align-items: center; justify-content: center; color: var(--wai-soft); }
  .judge .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--wai-soft); }
  .judge h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: -.6px; line-height: 1.1; }
  .judge .sub { font-size: 14.5px; color: var(--text-secondary); line-height: 1.45; max-width: 300px; }
  .judge .sub b { color: var(--text-primary); }

  .vs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
  .vc { padding: 16px 14px; border-radius: var(--r-xl); text-align: left; display: flex; flex-direction: column; gap: 7px; }
  .vc .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--text-tertiary); }
  .vc .val { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -.3px; line-height: 1.15; }
  .vc.ans { background: rgba(255,255,255,.05); border: .5px solid rgba(255,255,255,.16); }
  .vc.truth { background: rgba(125,211,252,.09); border: .5px solid rgba(125,211,252,.4); }
  .vc.truth .val { color: var(--wai-soft); }

  .final { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-tertiary); }
  .final .li { width: 16px; height: 16px; color: var(--text-tertiary); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
</style>
</head>
<body>
<div class="phone-stage wai-stage">
  <div class="phone">
    <div class="island"></div>
    <div class="phone-screen wai" data-screen-label="Phone · Судья">
      <div class="wai-bg"><div class="blob b1"></div><div class="blob b2"></div></div>
      <div class="status">
        <span class="time">9:41</span>
        <span class="ic">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="#fff"></rect><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="#fff"></rect><rect x="9" y="2" width="3" height="10" rx=".6" fill="#fff"></rect><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="#fff" opacity=".4"></rect></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".4" fill="none"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="1.6" fill="#fff"></rect><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".5"></path></svg>
        </span>
      </div>

      <div class="content">
        <div class="appbar">
          <div class="brand"><div class="m"><span class="li" style="width:22px;height:22px;color:#052e46;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.2" r="3.4"></circle><path d="M3.8 19.4c.8-3.3 3.1-5.2 5.7-5.2 1.6 0 3 .6 4.1 1.8"></path><path d="M16.2 9.4c0-1.4 1.1-2.3 2.4-2.2 1.2 0 2.2 1 2.1 2.3-.1 1.6-2.2 1.7-2.3 3.2"></path><path d="M18.4 16.3v.01"></path></svg></span></div><div class="nm">Кто я?<small>Party Hub</small></div></div>
          <div class="rcode">A7QX</div>
        </div>

        <div class="judge glass-strong" data-comment-anchor="wai-judge-card">
          <div class="ic"><span class="li" style="width:40px;height:40px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15"></path><path d="M6 6.5h12"></path><path d="M6 6.5L3.5 12.5a2.9 2.9 0 005 0z"></path><path d="M18 6.5l-2.5 6a2.9 2.9 0 005 0z"></path><path d="M9 19h6"></path></svg></span></div>
          <span class="k">ты — судья</span>
          <h1>Засчитать ответ Кати?</h1>
          <div class="sub"><b>Катя</b> настаивает, что угадала своего персонажа, но написание не совпало точь-в-точь</div>
          <div class="vs">
            <div class="vc ans">
              <span class="lbl">ответ Кати</span>
              <span class="val">«Чебурашк»</span>
            </div>
            <div class="vc truth">
              <span class="lbl">персонаж</span>
              <span class="val">«Чебурашка»</span>
            </div>
          </div>
          <div class="final">
            <span class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5"></path><path d="M12 7.5v.01"></path></svg></span>
            Твой вердикт — окончательный
          </div>
        </div>

        <div class="spacer"></div>

        <div class="actions">
          <button class="btn reject">Отклонить</button>
          <button class="btn success">Верно</button>
        </div>
      </div>

      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
  function fit(){ const s = Math.min((innerHeight-28)/874, (innerWidth-28)/402); document.querySelector('.phone').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
